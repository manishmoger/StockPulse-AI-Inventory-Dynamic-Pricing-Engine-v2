spring.application.name=stockpulse-backend
server.port=8080

# H2 file-backed database
spring.datasource.url=jdbc:h2:file:./data/stockpulse;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# AI provider — Zycus LiteLLM gateway (pre-configured for hackathon)
ai.provider=${AI_PROVIDER:zycus}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:qwen-cursor}
ai.base-url=${AI_BASE_URL:https://litellm-qc.zycus.net/v1/chat/completions}
ai.product-header=${AI_PRODUCT_HEADER:PC1}
ai.cookie=${AI_COOKIE:}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Demand spike threshold multiplier
app.demand-spike-multiplier=${DEMAND_SPIKE_MULTIPLIER:3.0}

# Logging
logging.level.com.stockpulse=INFO
logging.level.org.springframework.web=WARN
